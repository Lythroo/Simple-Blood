// Fabric buildscript for OBFUSCATED Minecraft (1.20.1, 1.21.x).
// Uses fabric-loom-remap with official Mojang mappings, and remapped mod deps.
plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

def mcVersion = project.property('deps.minecraft')
def javaVersion = (project.property('java_version') as String).toInteger()

version = "${project.property('mod_version')}+${mcVersion}"
group = 'com.simpleblood'

base { archivesName = 'simpleblood-fabric' }

stonecutter {
    // 1.20.1 and all 1.21.x use the older Fabric API class name for particle providers.
    replacements.string(true) {
        replace 'ParticleProviderRegistry', 'ParticleFactoryRegistry'
    }
    // 1.21.1 and older predate the ResourceLocation -> Identifier rename (1.21.11+).
    replacements.string(stonecutter.eval(stonecutter.current.version, '<=1.21.1')) {
        replace 'Identifier', 'ResourceLocation'
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(javaVersion) }
    withSourcesJar()
}

loom {
    runs {
        named('client') {
            client()
            ideConfigGenerated = true
            runDir = 'run'
            // -PnoIrisPbr: dev client without the blood's labPBR specular map under Iris.
            if (project.hasProperty('noIrisPbr')) vmArg '-Dsimpleblood.irisPbr=false'
            // Loom runs 1.20.1 on LWJGL 3.3.2, which Sodium 0.5 refuses at startup (its
            // issue 2561 check wants exactly 3.3.1). Fine for a dev client: skip the check.
            vmArg '-Dsodium.checks.issue2561=false'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.layered {
        officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${project.property('deps.fabric_loader')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.property('deps.fabric_api')}"

    // Mod Menu: Fabric-only, compile-only, never bundled.
    def modmenu = project.findProperty('deps.modmenu')
    if (modmenu && modmenu != 'none') {
        def mmDep = "com.terraformersmc:modmenu:${modmenu}"
        modCompileOnly mmDep
        modLocalRuntime mmDep
    }

    // Iris (+ Sodium, which it needs), to look at the blood under shaders: run in the dev
    // client only, never compiled against or bundled. Set per version in gradle.properties
    // ("none" switches one off; Sodium runs on its own with -Pdeps.iris=none).
    def iris = project.findProperty('deps.iris')
    def sodium = project.findProperty('deps.sodium')
    if (sodium && sodium != 'none') modLocalRuntime "maven.modrinth:sodium:${sodium}"
    if (iris && iris != 'none' && sodium && sodium != 'none') {
        modLocalRuntime "maven.modrinth:iris:${iris}"
        // The libraries Iris carries inside its jar: remapped dev mods lose them, and Iris then
        // crashes the moment a shader pack loads. Versions as bundled by that Iris build.
        localRuntime 'org.anarres:jcpp:1.4.14'
        localRuntime 'org.antlr:antlr4-runtime:4.13.1'
        localRuntime "io.github.douira:glsl-transformer:${project.property('deps.iris_glsl_transformer')}"
    }
}

processResources {
    exclude 'META-INF/neoforge.mods.toml', 'META-INF/mods.toml' // keep this a Fabric-only jar
    inputs.property 'version', project.version
    inputs.property 'mixinCompat', project.property('mixin_compat')
    inputs.property 'minecraftRange', mcVersion
    filesMatching(['fabric.mod.json', 'simpleblood.mixins.json']) {
        expand version: project.version,
                mixinCompat: project.property('mixin_compat'),
                extraMixins: (stonecutter.eval(stonecutter.current.version, '>=1.21.11') ? ', "RenderTypeInvoker"' : ''), // 1.21.11+: RenderType.create for the shader clouds
                minecraft_range: mcVersion // exact game version → correct Modrinth detection
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
    it.options.encoding = 'UTF-8'
}
