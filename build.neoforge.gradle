plugins {
    id 'net.neoforged.moddev'
}

def mcVersion = project.property('deps.minecraft')
def javaVersion = (project.property('java_version') as String).toInteger()

version = "${project.property('mod_version')}+${mcVersion}"
group = 'com.simpleblood'

base { archivesName = 'simpleblood-neoforge' }

// Only 1.21.1 predates the ResourceLocation -> Identifier rename (1.21.11+).
stonecutter {
    replacements.string(stonecutter.current.version == '1.21.1') {
        replace 'Identifier', 'ResourceLocation'
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(javaVersion) }
    withSourcesJar()
}

neoForge {
    version = project.property('deps.neoforge')

    runs {
        register('client') {
            client()
            gameDirectory = file('run')
            // -PnoIrisPbr: dev client without the blood's labPBR specular map under Iris.
            if (project.hasProperty('noIrisPbr')) jvmArgument '-Dsimpleblood.irisPbr=false'
            // Iris gives entity-format programs an overlay sampler that vanilla types like
            // breeze_wind never bind; the dev-only sampler check then crashes (Iris #3137/#3347).
            if (project.findProperty('deps.iris')) jvmArgument '-Dneoforge.disableGlValidation=true'
            // 26.3: Iris's shadow pipelines carry one vertex format where the dev-only draw check
            // (FrontendGpuDevice.STRICT_VALIDATION) expects sixteen.
            if (project.findProperty('deps.iris')) jvmArgument '-Dneoforge.disableBlaze3DValidation=true'
        }
    }

    mods {
        register('simpleblood') {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    devShaderMods { transitive = false } // Iris + Sodium for the dev client (see copyShaderMods)
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Iris (+ Sodium, which it needs), to look at the blood under shaders: run in the dev
    // client only, never compiled against or bundled. Set per version in gradle.properties
    // ("none" switches it off).
    def iris = project.findProperty('deps.iris')
    def sodium = project.findProperty('deps.sodium')
    if (iris && iris != 'none' && sodium && sodium != 'none') {
        devShaderMods "maven.modrinth:iris:${iris}"
        devShaderMods "maven.modrinth:sodium:${sodium}"
    }
}

// On the classpath NeoForge loads them as mods but keeps Sodium's classes from the game, so
// they go into the run's mods folder instead, as a player would install them.
def copyShaderMods = tasks.register('copyShaderMods', Copy) {
    from configurations.devShaderMods
    into file('run/mods')
    doFirst {
        fileTree('run/mods').matching { include 'iris-*.jar', 'sodium-*.jar' }.each { it.delete() }
    }
}
tasks.matching { it.name == 'runClient' }.configureEach { dependsOn copyShaderMods }

processResources {
    exclude 'fabric.mod.json' // keep this a NeoForge-only jar
    exclude 'META-INF/mods.toml' // the 1.20.1 (Forge-era) metadata
    def minecraftRange = "[${mcVersion}]" // Maven exact range → correct Modrinth detection
    inputs.property 'version', project.version
    inputs.property 'mixinCompat', project.property('mixin_compat')
    inputs.property 'minecraftRange', minecraftRange
    // NeoForge 26.3 retired `logoFile` in favour of `iconFile` (square) / `bannerFile`; older loaders only know `logoFile`.
    def newLogoKeys = stonecutter.eval(stonecutter.current.version, '>=26.3')
    def logoLines = newLogoKeys ? 'iconFile = "assets/simpleblood/icon.png"' : 'logoFile = "assets/simpleblood/icon.png"' + '\n' + 'logoBlur = false'
    inputs.property 'logoLines', logoLines
    filesMatching(['META-INF/neoforge.mods.toml', 'simpleblood.mixins.json']) {
        expand version: project.version,
                mixinCompat: project.property('mixin_compat'),
                extraMixins: (stonecutter.eval(stonecutter.current.version, '>=1.21.11') ? ', "RenderTypeInvoker"' : ''), // 1.21.11+: RenderType.create for the shader clouds
                minecraft_range: minecraftRange,
                logo_lines: logoLines
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
    it.options.encoding = 'UTF-8'
}
