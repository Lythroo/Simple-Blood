// Fabric buildscript for UNOBFUSCATED Minecraft (26.x+).
// Uses the plain fabric-loom plugin with no mappings (the game ships named).
plugins {
    id 'net.fabricmc.fabric-loom'
}

def mcVersion = project.property('deps.minecraft')
def javaVersion = (project.property('java_version') as String).toInteger()

version = "${project.property('mod_version')}+${mcVersion}"
group = 'com.simpleblood'

base { archivesName = 'simpleblood-fabric' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(javaVersion) }
    withSourcesJar()
}

loom {
    runs {
        named('client') {
            client()
            ideConfigGenerated = true
            runDir = 'run'
            // -PnoIrisPbr: dev client without the blood's labPBR specular map under Iris.
            if (project.hasProperty('noIrisPbr')) vmArg '-Dsimpleblood.irisPbr=false'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    implementation "net.fabricmc:fabric-loader:${project.property('deps.fabric_loader')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.property('deps.fabric_api')}"

    // Mod Menu: Fabric-only, compile-only, never bundled.
    def modmenu = project.findProperty('deps.modmenu')
    if (modmenu && modmenu != 'none') {
        def mmDep = "com.terraformersmc:modmenu:${modmenu}"
        compileOnly mmDep
        localRuntime mmDep
    }

    // Iris (+ Sodium, which it needs), to look at the blood under shaders: run in the dev
    // client only, never compiled against or bundled. Set per version in gradle.properties
    // ("none" switches it off).
    def iris = project.findProperty('deps.iris')
    def sodium = project.findProperty('deps.sodium')
    if (iris && iris != 'none' && sodium && sodium != 'none') {
        localRuntime "maven.modrinth:iris:${iris}"
        localRuntime "maven.modrinth:sodium:${sodium}"
    }

    // Physics Mod, to try the ragdoll blood: run in the dev client only, never bundled. The
    // integration touches it by reflection alone, so nothing is compiled against it.
    def physicsmod = project.findProperty('deps.physicsmod')
    if (physicsmod && physicsmod != 'none') {
        localRuntime "maven.modrinth:physicsmod:${physicsmod}"
    }
}

processResources {
    exclude 'META-INF/neoforge.mods.toml', 'META-INF/mods.toml' // keep this a Fabric-only jar
    inputs.property 'version', project.version
    inputs.property 'mixinCompat', project.property('mixin_compat')
    inputs.property 'minecraftRange', mcVersion
    filesMatching(['fabric.mod.json', 'simpleblood.mixins.json']) {
        expand version: project.version,
                mixinCompat: project.property('mixin_compat'),
                extraMixins: ', "RenderTypeInvoker"', // 1.21.11+: RenderType.create for the shader clouds
                minecraft_range: mcVersion // exact game version → correct Modrinth detection
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
    it.options.encoding = 'UTF-8'
}
