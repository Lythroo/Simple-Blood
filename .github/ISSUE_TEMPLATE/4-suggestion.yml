name: Suggestion
description: An idea for a new feature or setting.
title: "[Suggestion] "
labels: ["suggestion"]
body:
  - type: dropdown
    id: area
    attributes:
      label: What is it about?
      options:
        - Blood on blocks
        - Blood on mobs or players
        - Ragdolls or bodies
        - Particles, giblets or effects
        - Settings or the settings screen
        - Sounds
        - Shaders
        - Modpack or server options
        - Something else
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should it look like or do? A few sentences are enough.
    validations:
      required: true
  - type: dropdown
    id: setting
    attributes:
      label: Should it be a setting you can turn off?
      options: ["Yes", "No, always on", "Doesn't matter"]
  - type: textarea
    id: media
    attributes:
      label: Pictures or references (optional)
      description: A picture or video from another game or mod helps.
